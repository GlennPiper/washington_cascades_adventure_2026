name: iPad map GPS and fullscreen tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run iPad map tests
        run: python scripts/test_ipad_maps.py
